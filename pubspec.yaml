name: campus_crm
description: Cross-platform (Web and Mobile) management system for small teaching institutes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase (Offline-first Cloud Firestore)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1

  # 1-Click External Actions (Call, WhatsApp, Email, Maps)
  url_launcher: ^6.3.0

  # Formatting & Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
